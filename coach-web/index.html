.cm-official{position:fixed;inset:0;z-index:120;background:#4b5563;overflow:auto;padding:60px 0 40px;direction:rtl}
.cm-official .tb{position:fixed;top:0;inset-inline:0;z-index:121;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;background:#111827e6;backdrop-filter:blur(8px);flex-wrap:wrap}
.cm-official .tb button{display:flex;align-items:center;gap:6px;border-radius:10px;padding:8px 16px;font:600 14px Vazirmatn,sans-serif;cursor:pointer;border:0}
.cm-official .tb span{color:#d1d5db;font:12px Vazirmatn,sans-serif}
.od{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#111827;padding:14mm 15mm 16mm;font:10pt/1.9 Vazirmatn,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.od *{box-sizing:border-box}
.od .bs{text-align:center;font-weight:700;font-size:10.5pt;margin-bottom:2mm}
.od .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0f766e;padding-bottom:3mm;margin-bottom:5mm}
.od .lh .org{font-weight:800;font-size:12pt;color:#0f766e;line-height:1.6}.od .lh .org small{display:block;font-weight:500;font-size:9pt;color:#4b5563}
.od .lh .meta{font-size:9pt;line-height:1.9;color:#374151;min-width:42mm}.od .lh .meta b{display:inline-block;min-width:13mm;color:#6b7280;font-weight:500}
.od .to{font-weight:800;font-size:11pt;margin:0 0 1mm}.od .subj{font-weight:800;margin:2mm 0 3mm}.od .subj span{font-weight:500}
.od p{margin:0 0 2.5mm;text-align:justify}
.od h2{font-size:11.5pt;font-weight:900;color:#0f766e;margin:6mm 0 2.5mm;padding-bottom:1mm;border-bottom:1px solid #ccfbf1}
.od .kp{display:grid;grid-template-columns:repeat(5,1fr);gap:2mm;margin:3mm 0}
.od .kp div{border:1px solid #e5e7eb;border-radius:2mm;padding:2mm;text-align:center;font-size:8pt;color:#6b7280;line-height:1.5}
.od .kp b{display:block;font-size:13pt;color:#111827;font-weight:900}
.od table{width:100%;border-collapse:collapse;font-size:8.6pt;line-height:1.6}
.od th{background:#f0fdfa;color:#115e59;font-weight:700;padding:1.4mm 1.5mm;border:1px solid #d1fae5;text-align:center}
.od td{padding:1.3mm 1.5mm;border:1px solid #e5e7eb;text-align:center;vertical-align:middle}
.od td.nm{text-align:right;font-weight:800;white-space:nowrap}.od td.st{text-align:right;font-size:8.2pt}
.od thead{display:table-header-group}.od tr{break-inside:avoid}
.od .up{color:#047857;font-weight:800}.od .dn{color:#b91c1c;font-weight:700}.od .mu{color:#9ca3af}
.od ul.hl{margin:0;padding-right:5mm}.od ul.hl li{margin-bottom:.6mm}
.od .pc{border:1px solid #d1d5db;border-radius:3mm;padding:3.5mm 4mm;margin:0 0 4mm;break-inside:avoid}
.od .pc .ph{display:flex;justify-content:space-between;align-items:center;gap:3mm;margin-bottom:2mm}
.od .pc .ph h3{margin:0;font-size:12.5pt;font-weight:900}.od .pc .ph h3 small{font-size:8.5pt;color:#6b7280;font-weight:500;margin-right:2mm}
.od .pc .sc{display:flex;gap:2mm}.od .pc .sc div{border-radius:2mm;padding:1mm 3mm;font-size:8pt;text-align:center;line-height:1.4;background:#f9fafb;border:1px solid #e5e7eb;color:#6b7280}
.od .pc .sc b{display:block;font-size:12pt;color:#111827}.od .pc .sc .g{background:#ecfdf5;border-color:#a7f3d0}.od .pc .sc .g b{color:#047857}
.od .pc .cols{display:grid;grid-template-columns:1.05fr 1fr;gap:4mm}
.od .pc h4{margin:0 0 1mm;font-size:9.5pt;color:#0f766e}
.od .pc ul{margin:0;padding-right:4.5mm;font-size:9pt;line-height:1.85}
.od .pc .mt td,.od .pc .mt th{font-size:7.8pt;padding:.8mm 1.2mm}
.od .pc .fc{margin-top:2mm;font-size:8.4pt;color:#374151;background:#f9fafb;border-radius:2mm;padding:1.2mm 2.5mm}
.od .chart{margin:2mm 0 1mm;break-inside:avoid}.od .lg{display:flex;gap:5mm;font-size:8pt;color:#4b5563;justify-content:center}.od .lg i{display:inline-block;width:3mm;height:3mm;border-radius:.8mm;margin-left:1.2mm;vertical-align:middle}
.od .sig{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:10mm;text-align:center;font-size:9.5pt;break-inside:avoid}
.od .sig div{min-height:30mm}.od .sig b{display:block}.od .sig span{color:#6b7280;font-size:8.5pt}
.od .note{font-size:7.8pt;color:#6b7280;line-height:1.75;border-top:1px solid #e5e7eb;padding-top:2mm;margin-top:6mm}
.od .pb{break-before:page}
.od .rk{font-size:8pt;color:#6b7280;margin-top:1.5mm}
.od .sg{break-inside:avoid;margin-bottom:3mm}.od .sg h4{margin:0 0 1mm;font-size:10pt;color:#115e59}
.od .sg ul{margin:0;padding-right:5mm;font-size:9.2pt;line-height:1.9}

  @page{size:A4;margin:12mm 0 14mm;@bottom-center{content:"صفحه " counter(page, persian) " از " counter(pages, persian);font:8pt Vazirmatn,sans-serif;color:#9ca3af}}
  @page:first{margin-top:0}

.cm-report{position:fixed;inset:0;z-index:120;background:#4b5563;overflow:auto;padding:56px 0 40px;direction:rtl}
.cm-toolbar{position:fixed;top:0;inset-inline:0;z-index:121;display:flex;gap:8px;justify-content:center;padding:10px;background:#111827cc;backdrop-filter:blur(8px)}

.rp{width:210mm;height:297mm;margin:0 auto 16px;background:#fff;color:#111827;padding:6mm 11mm 4mm;display:flex;flex-direction:column;gap:1.4mm;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:Vazirmatn,sans-serif}

.rp .team{font-size:8.5pt;color:#0f766e;font-weight:600}.rp h1{font-size:20pt;font-weight:900;line-height:1.25;margin:0}

.rp .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm}
.rp .kpi{border:1px solid #e5e7eb;border-radius:6px;padding:1.6mm 2.4mm;background:#fafafa}
.rp .kpi .l{font-size:7pt;color:#6b7280}.rp .kpi .v{font-size:13pt;font-weight:800;line-height:1.35}.rp .kpi .s{font-size:6.8pt;color:#9ca3af}
.rp .row2{display:grid;grid-template-columns:1.6fr 1fr;gap:2.6mm}
.rp .box{border:1px solid #e5e7eb;border-radius:7px;padding:2.2mm 3mm}
.rp h2{font-size:9.5pt;font-weight:800;color:#0f766e;margin:0 0 1.3mm}.rp h2 small{font-weight:400;color:#9ca3af;font-size:7pt}
.rp ul{padding-right:4mm;margin:0;font-size:8.2pt;line-height:1.65}
.rp .legend{font-size:7pt;color:#6b7280;display:flex;gap:10px;flex-wrap:wrap;margin-top:1mm}
.rp table{width:100%;border-collapse:collapse}
.rp .h2h td{font-size:8.2pt;padding:1mm 0;border-bottom:1px solid #f3f4f6}.rp .h2h td:last-child{text-align:left;font-weight:800;white-space:nowrap}
.rp .bar{display:flex;height:6mm;border-radius:5px;overflow:hidden}.rp .bar div{color:#fff;font-size:7.3pt;font-weight:800;display:grid;place-items:center;white-space:nowrap;overflow:hidden}
.rp .drills{font-size:7.6pt;line-height:1.5}.rp .drills th{font-size:7pt;color:#6b7280;text-align:right;font-weight:600;border-bottom:1px solid #e5e7eb;padding:.8mm 1mm}
.rp .drills td{padding:1.1mm 1mm;border-bottom:1px solid #f3f4f6;vertical-align:top}
.rp .cat{color:#fff;border-radius:4px;padding:.2mm 1.6mm;font-size:6.8pt;font-weight:700;white-space:nowrap}
.rp .phys{margin-top:1.6mm;font-size:7.9pt;line-height:1.65;background:#f0fdfa;border-radius:5px;padding:1.4mm 2.4mm}
.rp .goals{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm}
.rp .goals div{background:#f9fafb;border:1px dashed #99f6e4;border-radius:6px;padding:1.2mm 1.8mm;font-size:6.6pt;color:#6b7280;line-height:1.5}
.rp .goals b{display:block;font-size:8.6pt;color:#111827}.rp .goals .ok{border-color:#10b981;background:#ecfdf5}
.rp .two{display:grid;grid-template-columns:1fr 1fr;gap:2.6mm}.rp .up{color:#059669;font-weight:700}.rp .dn{color:#e11d48;font-weight:700}.rp .warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;padding:1.2mm 2.4mm;font-size:7.6pt;line-height:1.6}
.rp footer{margin-top:auto;font-size:6.9pt;color:#9ca3af;line-height:1.6;border-top:1px solid #e5e7eb;padding-top:1.6mm}
@media print{
  @page{size:A4;margin:0}
  body > *:not(.cm-report){display:none !important}
  html,body{background:#fff !important}
  .cm-report{position:static;padding:0;background:#fff;overflow:visible}
  .cm-toolbar{display:none}
  .rp{margin:0;box-shadow:none;page-break-after:always}
